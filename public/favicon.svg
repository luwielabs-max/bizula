    <!-- Eyes -->
    <path
      d="M67 101C67 82 81 69 99 69C117 69 129 82 129 101V139C129 159 115 172 98 172C80 172 67 159 67 139V101Z"
      fill="#FFFFFF"
    />

    <path
      d="M127 101C127 82 139 69 157 69C175 69 189 82 189 101V139C189 159 176 172 158 172C141 172 127 159 127 139V101Z"
      fill="#FFFFFF"
