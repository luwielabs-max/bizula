<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 256 256"
  fill="none"
>
  <defs>
    <linearGradient
      id="faviconPurple"
      x1="32"
      y1="20"
      x2="224"
      y2="236"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#8B5CF6" />
      <stop offset="1" stop-color="#4C1D95" />
    </linearGradient>

    <filter
      id="faviconShadow"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="10"
        flood-color="#2E1065"
        flood-opacity="0.25"
      />
    </filter>
  </defs>

  <!-- Rounded app-icon background -->
  <rect
    x="8"
    y="8"
    width="240"
    height="240"
    rx="64"
    fill="url(#faviconPurple)"
  />

  <!-- Enlarged Bizula face -->
  <g
